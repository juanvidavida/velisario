name: Valida dati

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Valida data/voci.json e data/fonti.json
        run: python3 scripts/valida.py
      - name: Valida data/voci-es.json
        run: python3 scripts/valida_es.py
      - name: Valida data/voci-cat.json
        run: python3 scripts/valida_cat.py
